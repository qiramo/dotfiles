general {
	gaps_in = 5
	gaps_out = 10

	border_size = 0
}

animations {
	enabled = true
}

decoration {
	rounding = 10

	shadow {
		enabled = false
	}

	blur {
		enabled = false
	}
}

misc {
	vfr = true
	disable_hyprland_logo = true
	force_default_wallpaper = false
}

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
